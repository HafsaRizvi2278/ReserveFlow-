services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reserveflow
      POSTGRES_PASSWORD: reserveflow_local
      POSTGRES_DB: reserveflow
    ports:
      - "5432:5432"
    volumes:
      - reserveflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserveflow -d reserveflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reserveflow_pg:
